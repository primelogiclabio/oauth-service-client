name: release

# Pushing a vX.Y.Z tag builds both flavors on JDK 21, signs them and uploads them to the Central Portal:
# X.Y.Z (Java 21) and X.Y.Z-jdk8 (Java 8 to 20). They wait there, validated, until published in the Portal.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: Upload ${{ matrix.flavor.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor:
          - { name: 'Java 21 flavor', suffix: '', profiles: 'release' }
          - { name: 'Java 8 flavor', suffix: '-jdk8', profiles: 'release,jdk8' }
    steps:
      - name: Check the tag
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME isn't vX.Y.Z"
            exit 1
          fi
      - uses: actions/checkout@v7
      # JDK 8 too, so the Java 8 flavor's tests run on Java 8 against the classes being uploaded; 21 builds
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            21
          cache: maven
          server-id: central
          server-username-env-var: MAVEN_CENTRAL_USERNAME
          server-password-env-var: MAVEN_CENTRAL_PASSWORD
      - name: Build, test, sign and upload
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          VERSION_SUFFIX: ${{ matrix.flavor.suffix }}
          PROFILES: ${{ matrix.flavor.profiles }}
        run: |
          version="${GITHUB_REF_NAME#v}${VERSION_SUFFIX}"
          test_jvm=()
          if [ -n "$VERSION_SUFFIX" ]; then
            test_jvm=("-Djvm=$JAVA_HOME_8_X64/bin/java")
          fi
          mvn -B -ntp -P"$PROFILES" deploy -Drevision="$version" -Dchangelist= -Dgpg.signer=bc "${test_jvm[@]}"
