name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.build.name }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Two flavors: X.Y.Z for Java 21 (default build), X.Y.Z-jdk8 for Java 8 to 20 (-Pjdk8, automatic on JDK 8),
        # each on its own JDK: the Java 21 flavor on JDK 21 already covers the shared source there
        build:
          - { name: 'Java 8 flavor on JDK 8', java: '8', args: '' }
          - { name: 'Java 21 flavor on JDK 21', java: '21', args: '' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.build.java }}
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify ${{ matrix.build.args }}
